# SonarQube Cloud analysis settings, shared by the local run
# (scripts/run-sonar-scan.sh) and the CI job (.github/workflows/ci.yml), so a finding
# seen on a laptop is the same finding CI reports. Everything that varies per run --
# the token, the project version, the branch or pull request -- is passed on the
# command line instead of being written down here.
sonar.organization=ventura8
sonar.projectKey=ventura8_wayland-vnc
sonar.projectName=wayland-vnc

# The Python CLI and the native patch/test sources are the product; the shell scripts
# and Dockerfiles are the toolchain around it and are analysed as well.
sonar.sources=src,scripts,packaging,docker,native
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# The floor the package declares. Telling the analyser the version keeps it from
# reporting modernisations that would not run on the oldest interpreter we support.
sonar.python.version=3.11

# Coverage comes from the same run the >=90 % per-file gate reads, never a separate
# one: scripts/run-sonar-scan.sh writes coverage.xml from that run.
sonar.python.coverage.reportPaths=coverage.xml

# Build output, the virtual environment, the Git-ignored evidence tree and the 101
# translation catalogues are not reviewable source.
sonar.exclusions=.venv/**,artifacts/**,reports/**,build/**,po/**,**/*.po,**/*.mo,native/build/**

# The >=90 % per-file gate covers the product module; the host-side scripts, the
# fixtures and the native sources are exercised by the fixture and package smokes,
# which produce no Python coverage. Counting them as uncovered source would report a
# number that means nothing, so they are analysed for issues but left out of coverage.
sonar.coverage.exclusions=scripts/**,packaging/**,docker/**,native/**
