<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Lets the GDM Manager stub (tests/fixtures/gnome/gdm-stub.py) own the name on the
     system bus as root and lets the fixture session read its Version property. Only
     the KVM guest installs this; a real machine has GDM's own policy. -->
<busconfig>
  <policy user="root">
    <allow own="org.gnome.DisplayManager"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.gnome.DisplayManager"/>
  </policy>
</busconfig>
