<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Private, empty "system" bus for the isolated GNOME fixture. GNOME Shell requires
     a system bus connection; this one carries no logind, no polkit, and no host access.
     The runtime directory is fixed by the fixture image. -->
<busconfig>
  <type>system</type>
  <keep_umask/>
  <listen>unix:path=/tmp/wayland-vnc-runtime/system_bus</listen>
  <policy context="default">
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <allow own="*"/>
    <allow user="*"/>
  </policy>
</busconfig>
