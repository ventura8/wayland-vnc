# Isolated Hyprland fixture: headless output, XWayland disabled, native scene only.
monitor = HEADLESS-2, 1920x1080@60, 0x0, 1
# The KVM guest: virtio-gpu shows two connectors; the second is disabled from the
# start and the fixture's output sits at the origin at 1080p (see sway.conf).
monitor = Virtual-1, 1920x1080@60, 0x0, 1
monitor = Virtual-2, disable
xwayland {
    enabled = false
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
exec-once = env -u DISPLAY /usr/bin/python3 /fixture/scene.py
