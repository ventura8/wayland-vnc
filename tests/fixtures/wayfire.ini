# Isolated Wayfire fixture: headless, XWayland disabled, native scene only.
[core]
plugins = autostart session-lock
xwayland = false
vwidth = 1
vheight = 1

[autostart]
autostart_wf_shell = false
scene = env -u DISPLAY /usr/bin/python3 /fixture/scene.py

[output:HEADLESS-1]
mode = 1920x1080@60000
scale = 1.000000
# The KVM guest: virtio-gpu shows two connectors; the second is off from the start
# and the fixture's output sits at the origin at 1080p (see sway.conf).
[output:Virtual-1]
mode = 1920x1080@60000
position = 0,0
scale = 1.000000
[output:Virtual-2]
mode = off
