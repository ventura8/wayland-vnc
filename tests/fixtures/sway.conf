xwayland disable
output HEADLESS-1 mode 1920x1080 scale 1
# The KVM guest: virtio-gpu shows two connectors. The first is disabled here, before
# anything maps -- disabling it later would carry the scene's workspace to Virtual-1
# behind the workspace already shown there -- and the fixture's output sits at the
# origin at 1080p (the connector prefers its 4K maximum).
output Virtual-1 mode 1920x1080 scale 1 pos 0 0
output Virtual-2 disable
seat seat0 fallback true
default_border none
exec python3 /fixture/scene.py
