<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
<!-- GNOME HIG symbolic icon: 16x16 nominal grid with a margin, monochrome so the
     shell recolours it programmatically, 2px features and no 1px strokes. Shares the
     full-size icon's metaphor (a display receiving a connection) with the same
     simplification: no stand, no thin frame. -->
  <title>Wayland VNC</title>
  <g fill="#bebebe">
    <!-- Display: 2px border drawn as a filled ring so nothing renders 1px wide. -->
    <path d="M2 3h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm1 2v6h10V5z"/>
    <!-- Connection arrow inside the display. -->
    <rect x="4" y="7" width="4" height="2"/>
    <path d="M8 5.5L11.5 8 8 10.5z"/>
  </g>
</svg>
