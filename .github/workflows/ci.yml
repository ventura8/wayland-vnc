---
name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint + unit + coverage + native sanitizers + systemd units, in the isolated
  # checks image (mirrors the local `build-and-test.sh --full` lint/test steps).
  checks:
    name: Lint, unit tests, coverage, native
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install check tools
        run: |
          set -euo pipefail
          sudo apt-get update
          # GTK4/libadwaita typelibs and PyGObject are system packages, and Xvfb gives
          # the settings-app tests a display; the venv therefore inherits site-packages
          # so pylint and pytest can resolve `gi` the same way a desktop install does.
          # gettext provides xgettext/msgfmt/msgcat for the translation gate.
          sudo apt-get install -y shellcheck shfmt xvfb gettext \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1
          python3 -m venv --system-site-packages /tmp/wayland-vnc-checks
          /tmp/wayland-vnc-checks/bin/pip install -r requirements-dev.txt

      - name: Version sync check
        run: python3 scripts/sync-version.py --check

      - name: Lint (ruff, pylint, pymarkdown, shellcheck, shfmt, yamllint)
        run: |
          set -euo pipefail
          export PATH="/tmp/wayland-vnc-checks/bin:$PATH"
          ruff check src tests scripts
          ruff format --check src tests scripts
          pylint --persistent=n src/wayland_vnc
          # Documentation is linted like code; the config understands SKILL.md
          # front matter and sets the project's 140-column Markdown standard.
          pymarkdown -c .pymarkdown.json scan AGENTS.md CLAUDE.md README.md \
            SECURITY.md .github/copilot-instructions.md docs .agents
          shellcheck scripts/*.sh packaging/*.sh
          shfmt -d -i 2 scripts/*.sh packaging/*.sh
          yamllint .github .yamllint.yaml packaging/flatpak packaging/snap

      - name: Translation catalogues (template in sync, all 101 compile)
        run: |
          set -euo pipefail
          # A stale template means a newly added string reaches users untranslated in
          # every language, which the settings-app tests would not catch.
          bash scripts/build-translations.sh check
          # A missing, fuzzy or empty translation in ANY language fails the build.
          python3 scripts/i18n-lint.py
          bash scripts/build-translations.sh compile

      - name: Container and workflow lint
        run: bash scripts/lint-containers.sh

      - name: Native ASan/UBSan and systemd unit round trip
        run: |
          set -euo pipefail
          bash scripts/test-native.sh
          bash scripts/test-units.sh

      - name: Unit tests with per-file >=90% coverage
        run: |
          set -euo pipefail
          export PATH="/tmp/wayland-vnc-checks/bin:$PATH" PYTHONPATH="$PWD/src"
          coverage run -m pytest
          coverage report
          coverage json
          python3 scripts/check-coverage.py coverage.json

      - name: Empty qualification records must fail closed
        run: |
          set -euo pipefail
          # The checks venv carries jsonschema and rfc3339-validator, which the gate
          # needs; the verdict itself is checked, so a gate that exits non-zero before
          # judging (a missing module, a usage error) cannot "fail" as expected.
          export PATH="/tmp/wayland-vnc-checks/bin:$PATH"
          verdict=$(PYTHONPATH=src python3 scripts/check-release.py \
            --commit ci-commit --evidence-root artifacts/qualification-empty) &&
            { echo "Empty qualification records unexpectedly passed" >&2; exit 1; }
          grep -q '"passed": false' <<<"$verdict" ||
            { echo "check-release.py did not reach a verdict on the empty records" >&2; exit 1; }

  # SonarQube Cloud static analysis, with coverage from the same pinned pytest run the
  # local scan uses (scripts/run-sonar-scan.sh), so CI and a laptop report the same
  # findings. Skipped for pull requests from forks: GitHub withholds secrets there, and
  # public PR CI must never receive credentials (AGENTS.md).
  sonar:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Sonar attributes issues to commits and needs the history to do it; a
          # shallow clone makes every line look new.
          fetch-depth: 0

      - name: Install test tools
        run: |
          set -euo pipefail
          # Same system packages as the checks job: the settings-app tests import gi,
          # and a venv that could not see it would report those files as uncovered.
          sudo apt-get update
          sudo apt-get install -y xvfb python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1
          python3 -m venv --system-site-packages /tmp/wayland-vnc-sonar
          /tmp/wayland-vnc-sonar/bin/pip install -r requirements-dev.txt

      - name: Coverage report for Sonar
        id: analysis-inputs
        run: |
          set -euo pipefail
          export PATH="/tmp/wayland-vnc-sonar/bin:$PATH" PYTHONPATH="$PWD/src"
          coverage run -m pytest
          coverage xml -o coverage.xml
          # The release number lives only in VERSION; Sonar labels the analysis with it.
          echo "version=$(cat VERSION)" >>"$GITHUB_OUTPUT"

      # `qualitygate.wait` makes this step block on the gate's verdict and fail the
      # job when it is red, so a regression stops the build instead of only colouring
      # a dashboard nobody opens.
      - name: SonarQube Cloud scan and quality gate
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4  # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectVersion=${{ steps.analysis-inputs.outputs.version }}
            -Dsonar.qualitygate.wait=true

  # Isolated Wayland compositor fixtures: build the image and run the in-container
  # smoke checker. Plasma needs a DRM render node; GPU-less runners report BLOCKED.
  # Every container job below runs on both architectures the product ships for.
  # Docker picks the runner's own platform, so the same scripts build and run arm64
  # images on the arm64 runner with nothing to switch; scripts/target-arch.sh names
  # the architecture wherever a file name or a control field has to spell it out.
  fixture-smoke:
    name: Fixture smoke (${{ matrix.fixture }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fixture: [sway, labwc, xfce-labwc, lxqt-labwc, wayfire, gnome]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run ${{ matrix.fixture }} fixture smoke
        run: |
          set -euo pipefail
          mkdir -p reports/fixtures
          ./scripts/fixture-smoke.sh "${{ matrix.fixture }}" \
            2>&1 | tee "reports/fixtures/${{ matrix.fixture }}.log"
      - name: Upload fixture log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fixture-${{ matrix.fixture }}-${{ matrix.arch }}-log
          path: reports/fixtures/
          if-no-files-found: warn

  # Build every native package format and exercise install/uninstall (happy + bad
  # paths) across its platforms, in throwaway containers.
  package-smoke:
    name: Package smoke (${{ matrix.pkg }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pkg: [deb, rpm, arch]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        # The official archlinux image is x86_64 only (Arch Linux ARM is a separate
        # distribution), so the Arch package has no arm64 smoke.
        exclude:
          - pkg: arch
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run ${{ matrix.pkg }} package smoke
        run: |
          set -euo pipefail
          ./scripts/run_${{ matrix.pkg }}_package_smoke.sh
      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: package-smoke-${{ matrix.pkg }}-${{ matrix.arch }}
          path: |
            artifacts/${{ matrix.pkg }}/
            reports/distro-logs/
          if-no-files-found: warn

  # Prove the installer enables AND activates the service under a real systemd:
  # systemd runs as PID 1 in a privileged container, the real .deb installs so the
  # real postinst runs, and a user with a credential must end up active while one
  # without stays fail-closed. Purge must stop the running server.
  service-activation-smoke:
    name: Service activation smoke (systemd, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run service activation smoke
        run: |
          set -euo pipefail
          ./scripts/run_service_activation_smoke.sh
      - name: Upload activation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: service-activation-smoke-${{ matrix.arch }}
          path: reports/distro-logs/service-activation-smoke.log
          if-no-files-found: warn

  # Build the portable package formats and exercise them in throwaway containers:
  # AppImage runs the full scenario suite unconfined; snap validates the squashfs
  # payload + metadata (a real snapd install is a host step); flatpak validates the
  # manifest and the exact /app payload it installs.
  portable-smoke:
    name: Portable smoke (${{ matrix.fmt }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fmt: [appimage, snap, flatpak]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run ${{ matrix.fmt }} portable smoke
        run: |
          set -euo pipefail
          ./scripts/run_portable_package_smoke.sh "${{ matrix.fmt }}"
      - name: Upload portable artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: portable-smoke-${{ matrix.fmt }}-${{ matrix.arch }}
          path: |
            artifacts/portable/
            reports/distro-logs/
          if-no-files-found: warn
